<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 968 225" role="img" aria-label="四組同學的說明"><title>四組同學的說明</title><defs>
<pattern id="grain" width="15" height="12" patternUnits="userSpaceOnUse"><path d="M2 4h3m4 4h4" stroke="#312c28" opacity=".25"/><circle cx="6" cy="10" r=".7" fill="#fff" opacity=".35"/></pattern>
<pattern id="pebbles" width="28" height="23" patternUnits="userSpaceOnUse"><path d="M5 12Q1 7 6 5Q12 5 11 10Q9 15 5 12ZM18 20Q14 16 19 14Q24 14 23 19Z" fill="#9e9c92" stroke="#574d43" stroke-width="1"/></pattern>
<pattern id="hatch" width="11" height="11" patternUnits="userSpaceOnUse"><path d="M-2 2L2 -2M0 11L11 0M9 13L13 9" stroke="#856a50" stroke-width="1.5"/></pattern>
<pattern id="dots" width="16" height="15" patternUnits="userSpaceOnUse"><circle cx="3" cy="3" r="1.5" fill="#473d34"/><circle cx="11" cy="10" r="1" fill="#473d34"/></pattern>
<marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="4" markerHeight="4" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#d4342a"/></marker>
<marker id="blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="4" markerHeight="4" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#3a6896"/></marker>
</defs><style>text{font-family:system-ui,sans-serif;font-weight:800;fill:#1d2730;paint-order:stroke;stroke:white;stroke-width:3.4px;stroke-linejoin:round}</style><g transform="translate(0,0)"><text x="31" y="31" text-anchor="middle" font-size="22">(A)</text><rect x="12" y="44" width="218" height="166" rx="9" fill="#fcfbf6" stroke="#a39784" stroke-width="1.5"/><rect x="12" y="44" width="218" height="44" rx="9" fill="#e7e6d9" stroke="#a39784" stroke-width="1.5"/><text x="121" y="74" text-anchor="middle" font-size="20">組別　第一組</text><text x="121" y="114" text-anchor="middle" font-size="19">說明</text><text x="121" y="141" text-anchor="middle" font-size="18">若丙為大陸地殼，則</text><text x="121" y="166" text-anchor="middle" font-size="18">乙一定為海洋地殼，</text><text x="121" y="191" text-anchor="middle" font-size="18">甲一定為地函。</text></g><g transform="translate(242,0)"><text x="31" y="31" text-anchor="middle" font-size="22">(B)</text><rect x="12" y="44" width="218" height="166" rx="9" fill="#fcfbf6" stroke="#a39784" stroke-width="1.5"/><rect x="12" y="44" width="218" height="44" rx="9" fill="#e7e6d9" stroke="#a39784" stroke-width="1.5"/><text x="121" y="74" text-anchor="middle" font-size="20">組別　第二組</text><text x="121" y="114" text-anchor="middle" font-size="19">說明</text><text x="121" y="141" text-anchor="middle" font-size="18">若甲的厚度大於乙，</text><text x="121" y="166" text-anchor="middle" font-size="18">則乙一定為地函，</text><text x="121" y="191" text-anchor="middle" font-size="18">甲一定為地核。</text></g><g transform="translate(484,0)"><text x="31" y="31" text-anchor="middle" font-size="22">(C)</text><rect x="12" y="44" width="218" height="166" rx="9" fill="#fcfbf6" stroke="#a39784" stroke-width="1.5"/><rect x="12" y="44" width="218" height="44" rx="9" fill="#e7e6d9" stroke="#a39784" stroke-width="1.5"/><text x="121" y="74" text-anchor="middle" font-size="20">組別　第三組</text><text x="121" y="114" text-anchor="middle" font-size="19">說明</text><text x="121" y="141" text-anchor="middle" font-size="18">若丙為海洋地殼，且</text><text x="121" y="166" text-anchor="middle" font-size="18">丙以下為乙，則乙</text><text x="121" y="191" text-anchor="middle" font-size="18">一定為地函。</text></g><g transform="translate(726,0)"><text x="31" y="31" text-anchor="middle" font-size="22">(D)</text><rect x="12" y="44" width="218" height="166" rx="9" fill="#fcfbf6" stroke="#a39784" stroke-width="1.5"/><rect x="12" y="44" width="218" height="44" rx="9" fill="#e7e6d9" stroke="#a39784" stroke-width="1.5"/><text x="121" y="74" text-anchor="middle" font-size="20">組別　第四組</text><text x="121" y="114" text-anchor="middle" font-size="19">說明</text><text x="121" y="141" text-anchor="middle" font-size="18">不需再做其他說明，</text><text x="121" y="166" text-anchor="middle" font-size="18">根據黑板上的提示即</text><text x="121" y="191" text-anchor="middle" font-size="18">可得知甲一定為地核。</text></g></svg>
